name: Prepare production history database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-history-database
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify or create the history table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ensure-history-table.mjs
